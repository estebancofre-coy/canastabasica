<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#233f87">
  <title>Canasta básica | Instrumento de observación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#1d2a35;--blue:#233f87;--teal:#10a995;--mint:#e1f4ef;--coral:#d66b4d;--gold:#d69c34;--line:#d7e0e4;--paper:#fff;--wash:#f3f7f8;--muted:#586a73;--danger:#a43d35}
    *{box-sizing:border-box}
    body{margin:0;background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(35,63,135,.035) 31px 32px),var(--wash);color:var(--ink);font:16px/1.55 "DM Sans",sans-serif}
    button,input{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.48}
    .site-head{min-height:90px;background:var(--blue);color:#fff;padding:12px max(18px,calc((100vw - 1020px)/2));display:flex;align-items:center;gap:20px;border-bottom:5px solid var(--teal)}
    .site-head img{display:block;width:170px;height:auto;max-height:76px;object-fit:contain;background:#fff}
    .brand-copy{border-left:1px solid rgba(255,255,255,.35);padding-left:18px;flex:1}
    .brand-copy small{display:block;color:#a8e9db;font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
    .brand-copy strong{display:block;font-size:1rem;font-weight:600}
    .guide-button{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;padding:9px 13px;border-radius:5px}
    .guide-button[hidden]{display:none}
    main{width:min(100% - 32px,940px);margin:30px auto 70px}
    h1,h2,h3,p{margin-top:0}
    h1,h2{font-family:"DM Serif Display",Georgia,serif;line-height:1.14;letter-spacing:0}
    h1{font-size:2.25rem;margin-bottom:12px}
    h2{font-size:1.55rem;margin-bottom:8px}
    h3{font-size:1rem;margin-bottom:6px}
    p{margin-bottom:14px}
    .eyebrow{color:var(--teal);font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
    .manual-shell,.panel,.workspace{background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(31,51,64,.045)}
    .manual-shell{border-top:5px solid var(--teal);padding:22px 28px 24px}
    .manual-top{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:.76rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
    .manual-progress{height:4px;background:#e7edef;margin:12px 0 28px}
    .manual-progress div{height:100%;background:var(--teal);transition:width .2s}
    .slide{min-height:350px;max-width:790px;padding:8px 0 18px}
    .slide h1{max-width:760px;color:var(--blue)}
    .slide .lead{font-size:1.2rem;max-width:740px}
    .slide p,.slide li{max-width:790px}
    .slide li{margin:8px 0;padding-left:3px}
    .slide ol,.slide ul{padding-left:23px}
    .slide li::marker{color:var(--teal);font-weight:700}
    .discipline-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 26px;margin:16px 0}
    .discipline-grid>div,.discipline-grid>section{border-top:1px solid var(--line);padding:11px 0}
    .discipline-grid>div:nth-child(odd){color:var(--blue);font-weight:700}
    .discipline-grid p{font-size:.94rem;margin:0;color:var(--muted)}
    .formula{padding:16px 18px;margin:18px 0;background:var(--mint);border-left:4px solid var(--teal);font-weight:700;font-size:1.15rem;color:var(--blue)}
    .note,.notice{padding:12px 14px;background:var(--mint);border-left:4px solid var(--teal);margin:16px 0}
    .slide .note{max-width:740px}
    .slide-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:16px}
    .slide-dots{display:flex;gap:8px}
    .dot{width:10px;height:10px;padding:0;border:0;border-radius:50%;background:#c7d2d7}
    .dot.active{background:var(--teal);outline:3px solid var(--mint)}
    .manual-actions,.form-actions,.workspace-actions,.visit-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .manual-actions{padding-top:18px;justify-content:flex-end}
    .button{border:0;border-radius:5px;padding:10px 16px;font-weight:700;min-height:44px}
    .button.primary{background:var(--blue);color:#fff}
    .button.secondary{background:#e7eef1;color:var(--blue)}
    .button.quiet{background:transparent;color:var(--blue);border:1px solid var(--line)}
    .panel{padding:22px 24px}
    .panel.narrow{max-width:700px;margin-inline:auto}
    .panel>p:not(.eyebrow){color:var(--muted)}
    .action-stack{display:grid;gap:10px;max-width:360px;margin-top:24px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin:20px 0}
    label{display:block;font-weight:600;font-size:.9rem;margin:9px 0}
    input{width:100%;display:block;margin-top:5px;padding:11px 12px;border:1px solid #aebfc5;border-radius:5px;background:#fff;color:var(--ink);min-height:44px}
    input:focus{outline:3px solid rgba(16,169,149,.2);border-color:var(--teal)}
    .form-actions{justify-content:space-between;margin-top:22px}
    .code-input{max-width:440px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    .visit-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px;border-left:5px solid var(--coral);padding:4px 0 4px 18px}
    .visit-head h1{color:var(--blue)}
    .visit-head p:not(.eyebrow){margin-bottom:0;color:var(--muted)}
    .visit-code{font-family:"DM Sans",sans-serif;color:var(--teal);font-size:1.25rem;vertical-align:middle}
    .visit-actions{justify-content:flex-end}
    .workspace{padding:20px 22px}
    .section-heading{display:flex;align-items:center;justify-content:space-between;gap:14px}
    .section-heading h2{margin-bottom:0}
    .status{display:inline-flex;padding:4px 9px;border-radius:3px;font-size:.78rem;font-weight:700;white-space:nowrap}
    .status.open{background:#e5f5eb;color:#286e46}
    .status.closed{background:#e8edf7;color:var(--blue)}
    .category-list{margin-top:15px;border-top:1px solid var(--line)}
    .category-link{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto 20px;align-items:center;gap:14px;padding:14px 4px;color:var(--ink)}
    .category-link:hover:not(:disabled){background:#f7fbfa}
    .category-name{font-weight:700;color:var(--blue)}
    .category-progress{font-size:.84rem;color:var(--muted)}
    .category-arrow{font-size:1.5rem;color:var(--teal);text-align:right}
    .workspace-actions{justify-content:flex-end;margin-top:18px}
    .text-button{border:0;background:transparent;color:var(--blue);font-weight:700;padding:8px 0}
    .danger{color:var(--danger)}
    .product-list{border-top:1px solid var(--line);margin-top:20px}
    .product-row{padding:14px 4px;border-bottom:1px solid var(--line)}
    .product-row.missing{background:#fff8ed}
    .product-row.priced{background:#f5fbf8}
    .product-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .product-top h3{margin-bottom:2px;color:var(--blue)}
    .product-top p{font-size:.84rem;color:var(--muted);margin:0}
    .check-label{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:.83rem;margin:0}
    .check-label input{width:19px;height:19px;min-height:auto;margin:0;accent-color:var(--teal)}
    .price-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end;margin-top:5px}
    .price-line label{max-width:260px;margin-bottom:0}
    .price-line strong{min-width:120px;text-align:right;color:var(--blue);padding-bottom:11px}
    .category-total{display:flex;justify-content:space-between;padding:14px 5px;background:var(--mint);color:var(--blue);font-weight:700}
    .replacement-row{display:grid;grid-template-columns:1fr 1fr 150px auto;align-items:end;gap:10px;border-top:1px solid var(--line);padding:10px 0}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;margin:16px 0}
    th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-size:.82rem}
    .number{text-align:right;white-space:nowrap}
    .total-row{font-weight:700;color:var(--blue);background:#edf5f4}
    .benchmark{display:grid;gap:4px;padding:14px 16px;background:#fff3df;border-left:4px solid var(--gold);margin:18px 0}
    .benchmark span{font-size:.9rem}
    .notice.warning{background:#fff4e2;border-color:var(--gold)}
    .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10;max-width:min(90vw,520px);background:#1e2b34;color:#fff;padding:12px 16px;border-radius:5px;box-shadow:0 6px 22px rgba(0,0,0,.22)}
    .toast.bad{background:var(--danger)}
    @media(max-width:620px){
      .site-head{gap:10px;padding:10px 14px;min-height:75px}
      .site-head img{width:110px;max-height:56px}
      .brand-copy{padding-left:10px}
      .brand-copy strong{font-size:.85rem}
      .brand-copy small{font-size:.63rem}
      .guide-button{padding:7px 9px;font-size:.82rem}
      main{width:min(100% - 22px,940px);margin:16px auto 40px}
      h1{font-size:1.8rem}
      .manual-shell,.panel{padding:17px 16px}
      .manual-top{font-size:.65rem}
      .slide{min-height:0;padding-bottom:20px}
      .slide .lead{font-size:1.06rem}
      .discipline-grid{grid-template-columns:1fr;gap:0}
      .slide-controls{gap:8px}
      .slide-dots{gap:5px}
      .dot{width:8px;height:8px}
      .manual-actions{justify-content:stretch}
      .manual-actions .button{flex:1 1 150px}
      .form-grid{grid-template-columns:1fr;gap:0;margin:12px 0}
      .visit-head{display:block;padding-left:12px}
      .visit-actions{justify-content:flex-start;margin-top:14px}
      .workspace{padding:16px 13px}
      .category-link{grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;padding:12px 2px}
      .category-progress{grid-column:1;grid-row:2}
      .category-arrow{grid-column:2;grid-row:1 / span 2}
      .category-name{font-size:.93rem}
      .category-progress{font-size:.76rem}
      .product-top{display:block}
      .check-label{margin-top:9px}
      .price-line{grid-template-columns:minmax(0,1fr) auto;gap:8px}
      .price-line strong{min-width:90px;font-size:.9rem}
      .replacement-row{grid-template-columns:1fr 1fr}
      .replacement-row label:first-child{grid-column:1 / -1}
      .workspace-actions .button{flex:1 1 100%}
      .form-actions .button{flex:1}
      .section-heading{align-items:flex-start}
      .section-heading h2{font-size:1.35rem}
    }
  </style>
</head>
<body>
  <header class="site-head">
    <img id="brand-logo" src="trabajo_social_color.png" alt="Trabajo Social, Departamento de Ciencias Sociales y Humanidades, Universidad de Aysén">
    <div class="brand-copy"><small>Actividad 1 · Salida a terreno</small><strong>Instrumento de observación de la canasta básica</strong></div>
    <button id="guide-button" class="guide-button" type="button" hidden>Manual</button>
  </header>
  <main id="view" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
